services:
  - type: web
    name: miniedge-backend
    env: go
    buildCommand: go build -o miniedge ./cmd/main.go
    startCommand: ./miniedge -config ./config.example.json
    envVars:
      - key: MINIEDGE_API_KEY
        generateValue: true
      - key: MINIEDGE_ALLOWED_ORIGIN
        value: "*"
